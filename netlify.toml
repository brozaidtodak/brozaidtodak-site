[build]
  command = "npm run build"
  publish = "dist"

# Proxy /finance/* ke app finance (site berasingan) — URL kekal
# brozaidtodak.com/finance. MESTI sebelum SPA catch-all di bawah.
[[redirects]]
  from = "/finance/*"
  to = "https://finance.brozaidtodak.com/finance/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/finance"
  to = "/finance/"
  status = 301

# Pintasan senang ingat — 301 ke subdomain. Kekal site berasingan
# (origin asing, gate sendiri); path cuma jadi jalan masuk.
[[redirects]]
  from = "/prompt"
  to = "https://prompt.brozaidtodak.com"
  status = 301

[[redirects]]
  from = "/prompt/*"
  to = "https://prompt.brozaidtodak.com/:splat"
  status = 301

[[redirects]]
  from = "/training"
  to = "https://training.brozaidtodak.com"
  status = 301

[[redirects]]
  from = "/training/*"
  to = "https://training.brozaidtodak.com/:splat"
  status = 301

# Rujukan skill Claude Code — fail statik public/skills.html
[[redirects]]
  from = "/skills"
  to = "/skills.html"
  status = 200

# SPA catch-all untuk command centre (mesti PALING BAWAH)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
