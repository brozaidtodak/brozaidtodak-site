[build]
  command = "npm run build"
  publish = "dist"

# Proxy /finance/* ke app finance (site berasingan) — URL kekal
# brozaidtodak.com/finance. MESTI sebelum SPA catch-all di bawah.
[[redirects]]
  from = "/finance/*"
  to = "https://finance.brozaidtodak.com/finance/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/finance"
  to = "/finance/"
  status = 301

# SPA catch-all untuk command centre (mesti PALING BAWAH)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
